# Publishes howitworks-cli to npm when a GitHub release is published.
#
# Authentication, in order of preference:
#   1. npm trusted publishing (OIDC): no stored secret, and npm adds a provenance
#      attestation that links the package to this repo and commit. Set it up on
#      npmjs.com > howitworks-cli > Settings > Trusted publishing (GitHub Actions,
#      user "koppulapr2230", repository "howitworks", workflow "npm-publish.yml").
#   2. An npm token in the repository secret NPM_TOKEN. Needed once, for the very
#      first publish, because trusted publishing can only be set up on a package
#      that already exists. Delete the secret after trusted publishing works.
# npm tries trusted publishing first and falls back to the token.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow (trusted publishing) and sign provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs (11.5.1+)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version. Bump the version, merge, then tag v$version."
            exit 1
          fi

      - name: Check this version is not already on npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "howitworks-cli@$version" version >/dev/null 2>&1; then
            echo "::error::howitworks-cli@$version is already published. Bump the version first."
            exit 1
          fi

      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
